spring:
  application:
    name: mo-blog-backend

  datasource:
    driver-class-name:
    url:
    username:
    password:

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mybatis-plus:
    configuration:
      # 开启驼峰命名转换（数据库的 create_time 映射到 Java 的 createTime）
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    global-config:
      db-config:
        # 配置主键生成策略：自增
        id-type: auto

  sa-token:
    # token 名称（同时也是 cookie 名称）
    token-name: satoken
    # token 有效期（单位：秒） 默认30天，-1 代表永久有效
    timeout: 2592000
    # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
    active-timeout: 604800
    # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
    is-concurrent: true
    # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
    is-share: false
    # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
    token-style: uuid
    # 是否输出操作日志
    is-log: true

  data:
    redis:
      host:
      port:
      password:
      database: 10

blog:
  storage:
    # 上传图片时的存储方式
    local:
      path: mo/upload/
    cloud:
      api-token:
      upload-url: https://picui.cn/api/v1
      # API规定的图片文件头
      file-body-name: file

  github-oauth:
    client-id:
    client-secret: